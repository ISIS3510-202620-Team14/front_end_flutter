name: front_end_flutter
description: "Aplicación móvil del portal docente ENAd."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  http: ^1.6.0
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  firebase_analytics: ^12.6.0
  cloud_firestore: ^6.10.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
          weight: 500
        - asset: assets/fonts/Lexend.ttf
          weight: 700
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans.ttf
          weight: 400
        - asset: assets/fonts/WorkSans.ttf
          weight: 500
        - asset: assets/fonts/WorkSans.ttf
          weight: 600
        - asset: assets/fonts/WorkSans.ttf
          weight: 700
